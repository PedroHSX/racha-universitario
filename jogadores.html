  <body>
    <header class="topbar">
      <a href="home.html" class="logo">
  <span data-app-sigla>RU</span>
  <strong data-app-nome>Racha Universitário</strong>
</a>

      <nav class="navigation">
        <a href="home.html">Início</a>

      <a href="perfil.html" class="user-menu user-menu-link">
        <div>
          <strong>Usuário</strong>
          <small>@usuario</small>
        </div>

        <div class="avatar">RU</div>

    <main class="container">
      <section class="page-header">
        <div>
          <h1>Jogadores</h1>
          <p>Conheça os jogadores da pelada e acompanhe seus desempenhos.</p>
        </div>
      </section>

      <section class="filters">
        <input
          type="search"
          id="playerSearch"
          placeholder="Buscar jogador..."
        />

        <div class="filter-buttons">
          <button type="button" class="filter active" data-position="TODOS">Todos</button>
          <button type="button" class="filter" data-position="GOL">GOL</button>
          <button type="button" class="filter" data-position="DEF">DEF</button>
          <button type="button" class="filter" data-position="MEI">MEI</button>
          <button type="button" class="filter" data-position="ATA">ATA</button>
        </div>
      </section>

        <section id="featuredSection">
  <div class="section-title">
    <div>
      <h2>Destaques</h2>
      <p>Jogadores em evidência</p>
    </div>
  </div>

  <div class="featured-players" id="featuredPlayers"></div>
</section>

      <section class="players-section">
        <div class="section-title">
          <div>
            <h2>Todos os jogadores</h2>
            <p>Consulte OVR, pontuação e valor.</p>
          </div>
        </div>

        <div id="playersList" class="players-list"></div>
      </section>
